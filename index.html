    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .activity-details {
            transition: max-height 0.4s ease-in-out, opacity 0.4s ease-in-out;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }

        .activity-details.open {
            max-height: 10000px;
            opacity: 1;
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }

        .hero-gradient-minimal {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
        }

        .nav-btn.active {
            color: #ea580c;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>

        function updateCountdown() {
            const raceDate = new Date("2026-08-30T07:00:00+10:00").getTime();
            const now = new Date().getTime();
            const distance = raceDate - now;
            if (distance < 0) return;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

            document.getElementById("countdown").innerHTML = `
                <div class="flex flex-col"><span class="text-3xl font-bold">${days}</span><span class="text-[10px] text-gray-300">DAYS</span></div>

                <div class="text-2xl pt-1 opacity-50 text-sm flex items-end pb-2">直到起跑</div>

                                <div class="text-xs text-blue-600 mb-1">機票 <span class="ml-1 rounded-full border border-emerald-100 bg-emerald-50 px-1.5 py-0.5 text-[10px] font-bold text-emerald-600">已付</span></div>
                                <div class="font-bold text-gray-800">TWD $${flightPrice.toLocaleString()}</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 relative overflow-hidden">
                    <div class="absolute top-0 right-0 p-4 opacity-5">
                        <i class="fa-solid fa-file-invoice-dollar text-8xl"></i>
                    </div>
                    <div class="relative z-10">
                        <h2 class="text-lg font-bold text-gray-800 mb-1">預估花費明細</h2>
                        <div class="text-sm text-gray-500 mb-5">目前選擇：${planName}</div>
                        
                        <div class="space-y-3 mb-6">
                            ${data.items.map(item => `
                            <div class="flex justify-between items-center border-b border-gray-50 pb-2">
                                <div>
                                    <div class="text-sm font-medium text-gray-700 flex items-center gap-2">
                                        ${item.name}
                                        ${item.payment ? `
                                            <span class="rounded-full border px-1.5 py-0.5 text-[10px] font-bold ${paymentBadges[item.payment].className}">
                                                ${paymentBadges[item.payment].text}
                                            </span>
                                        ` : ''}
                                        ${item.linkType === 'hotel' ? `
                                            <a href="${hotelInfo.map}" target="_blank" rel="noopener noreferrer" class="text-orange-500">
                                                <i class="fa-solid fa-map-location-dot"></i>
                                            </a>
                                            <a href="${hotelInfo.website}" target="_blank" rel="noopener noreferrer" class="text-blue-500">
                                                <i class="fa-solid fa-globe"></i>
                                            </a>
                                        ` : ''}
                                        ${item.linkType === 'mini' ? `
                                            <a href="${miniMarathon.website}" target="_blank" rel="noopener noreferrer" class="text-blue-500">
                                                <i class="fa-solid fa-globe"></i>
                                            </a>
                                        ` : ''}
                                        ${item.link ? `
                                            <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="text-blue-500">
                                                <i class="fa-solid fa-globe"></i>
                                            </a>
                                        ` : ''}
                                    </div>
                                    <div class="text-[10px] text-gray-400">${item.note}</div>
                                </div>
                                <div class="text-sm font-mono font-bold ${item.costStr ? 'text-gray-500' : 'text-gray-800'}">
                                    ${item.costStr ? item.costStr : '$' + item.cost.toLocaleString()}
                                </div>
                            </div>
                            `).join('')}
                        </div>

                        ${prepaidZhuangTotal > 0 ? `<div class="bg-sky-50 text-sky-700 p-3 rounded-xl border border-sky-100 mb-3 flex justify-between items-center">
                            <div>
                                <div class="text-[10px] uppercase tracking-widest font-bold">莊先付</div>
                                <div class="text-xs text-sky-500">住宿與已代墊活動</div>
                            </div>
                            <div class="font-mono font-bold">TWD $${prepaidZhuangTotal.toLocaleString()}</div>
                        </div>` : ''}

                        <div class="bg-rose-50 text-rose-700 p-3 rounded-xl border border-rose-100 mb-3 flex justify-between items-center">
                            <div>
                                <div class="text-[10px] uppercase tracking-widest font-bold">待付款</div>
                                <div class="text-xs text-rose-500">尚未付款活動</div>
                            </div>
                            <div class="font-mono font-bold">TWD $${unpaidTotal.toLocaleString()}</div>
                        </div>

                        <div class="bg-slate-800 text-white p-4 rounded-xl shadow-lg">
                            <div class="text-[10px] opacity-80 uppercase tracking-widest mb-1">
                                <i class="fa-solid fa-plane mr-1"></i>總花費
                            </div>
                            <div class="text-xl font-bold font-mono text-emerald-400 leading-none">
                                <span class="text-xs mr-1 font-sans font-normal opacity-70">TWD</span>
                                $${total.toLocaleString()}
                            </div>
                        </div>
                    </div>
                </div>

            </div>
            `;
            container.innerHTML = html;
        }

        function switchTab(tab) {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active', 'text-orange-600');
                btn.classList.add('text-gray-400');
                if (btn.id === `btn-${tab}`) btn.classList.add('active', 'text-orange-600');
            });

            if (tab === 'itinerary') renderItinerary();
            else if (tab === 'checklist') renderChecklist();
            else if (tab === 'budget') renderBudget();
        }

        function toggleCard(index) {
            const content = document.getElementById(`card-${index}`);
            content.classList.toggle('open');
        }

        function toggleSpectatorZones(button) {
            const section = button.closest('.spectator-guide');
            const extraZones = section.querySelectorAll('.spectator-extra-zone');
            const isExpanding = Array.from(extraZones).some(zone => zone.classList.contains('hidden'));
            extraZones.forEach(zone => zone.classList.toggle('hidden', !isExpanding));
            section.querySelectorAll('.spectator-toggle').forEach((toggle, index) => {
                toggle.querySelector('span').textContent = isExpanding
                    ? '收合其他應援區'
                    : (index === 0 ? '展開全部' : '查看全部 7 個應援區');
                toggle.querySelector('i').className = `fa-solid ${isExpanding ? 'fa-chevron-up' : 'fa-chevron-down'} mr-1`;
            });
            if (!isExpanding) {
                section.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function toggleCheck(el) {
            const box = el.querySelector('.check-box');
            const text = el.querySelector('.check-text');
            box.classList.toggle('bg-orange-500');
            box.classList.toggle('border-orange-500');
            text.classList.toggle('line-through');
            text.classList.toggle('text-gray-400');
        }

        function toggleShoppingItem(button) {
            const card = button.closest('.shopping-item');
            const itemId = card.dataset.shoppingId;
            const purchasedItems = new Set(JSON.parse(localStorage.getItem('sydneyShoppingList') || '[]'));
            const isPurchased = purchasedItems.has(itemId);

            if (isPurchased) purchasedItems.delete(itemId);
            else purchasedItems.add(itemId);

            localStorage.setItem('sydneyShoppingList', JSON.stringify([...purchasedItems]));
            card.classList.toggle('border-emerald-100', !isPurchased);
            card.classList.toggle('bg-emerald-50/50', !isPurchased);
            card.classList.toggle('border-gray-100', isPurchased);
            card.classList.toggle('bg-gray-50', isPurchased);
            button.classList.toggle('border-emerald-500', !isPurchased);
            button.classList.toggle('bg-emerald-500', !isPurchased);
            button.classList.toggle('text-white', !isPurchased);
            button.classList.toggle('border-gray-300', isPurchased);
            button.classList.toggle('bg-white', isPurchased);
            button.classList.toggle('text-transparent', isPurchased);
            button.setAttribute('aria-label', isPurchased ? '標記已購買' : '取消已購買');
            const name = card.querySelector('.shopping-name');
            name.classList.toggle('line-through', !isPurchased);
            name.classList.toggle('text-gray-400', !isPurchased);
            name.classList.toggle('text-gray-800', isPurchased);
        }

        renderItinerary();
    </script>
</body>

</html>
